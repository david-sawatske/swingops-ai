services:
  - type: web
    name: swingops-ai-api-david-sawatske
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @swingops/api prisma:generate && pnpm --filter @swingops/api build
    startCommand: pnpm --filter @swingops/api exec prisma migrate deploy && node services/api/dist/scripts/run-admin-ops-maintenance.js && pnpm --filter @swingops/api start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swingops-ai-db-david-sawatske
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        value: https://swingops-ai-david-sawatske.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MODEL_PROVIDER_ATTEMPT_TIMEOUT_MS
        value: "10000"
      - key: MODEL_PROVIDER_WORKFLOW_TIMEOUT_MS
        value: "25000"
      - key: LIVE_DEMO_RETENTION_DAYS
        value: "14"
      - key: ADMIN_OPS_MAINTENANCE_INTERVAL_HOURS
        value: "24"

  - type: web
    name: swingops-ai-david-sawatske
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @swingops/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://swingops-ai-api-david-sawatske.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: swingops-ai-db-david-sawatske
    plan: basic-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    region: ohio
    postgresMajorVersion: "16"
    databaseName: swingops_ai
    user: swingops
    ipAllowList: []
