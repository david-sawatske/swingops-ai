name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: swingops_ai
          POSTGRES_PASSWORD: swingops
          POSTGRES_USER: swingops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swingops -d swingops_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_HOST: 127.0.0.1
      API_PORT: 4000
      DATABASE_URL: postgresql://swingops:swingops@localhost:5432/swingops_ai?schema=public
      ENABLE_REAL_MODEL_CALLS: "false"
      LOG_LEVEL: warn
      TEST_DATABASE_URL: postgresql://swingops:swingops@localhost:5432/swingops_ai_test?schema=public
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @swingops/api prisma:generate

      - name: Validate environment contract
        run: pnpm config:check

      - name: Lint and verify formatting
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run golden-demonstration browser test
        run: pnpm test:e2e

      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-artifacts
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore
          retention-days: 14
